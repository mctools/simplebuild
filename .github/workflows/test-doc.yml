name: build-docs
on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -el {0}
    env:
      CONDA_SOLVER: libmamba

    steps:
    - name: Checkout main repository
      uses: actions/checkout@v5

    - name: Setup conda environment
      uses: conda-incubator/setup-miniconda@v3
      with:
        miniforge-version: latest
        channels: conda-forge
        conda-remove-defaults: true
        activate-environment: publish-doc-condaenv
        environment-file: .github/resources/publish-doc-condaenv.yml
        #use-mamba: no

    - name: Install libpython matching python version
      #Newer python packages on conda-forge no longer always provide the
      #libpython shared library needed for embedding python:
      run: conda install --yes "libpython=$(python3 -c 'import sys;print("%i.%i"%sys.version_info[:2])')"

    - name: Conda list
      run: conda list

    - name: Install self
      run: python3 -mpip install .

    - name: Build documentation
      #NB: -W to turn warnings into errors:
      run: make html SPHINXOPTS="-W"
      working-directory: ./doc/

    - name: Check HTML links
      run: make linkcheck
      working-directory: ./doc/
