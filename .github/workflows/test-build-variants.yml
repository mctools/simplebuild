name: test-build-variants
on:
  push:
  pull_request:

# Workflow which tests build variants: the build.extra_cflags,
# build.extra_ldflags, and build.max_cachedirs cfg options, the -d/-r/-g/-x
# flags of sb, sbrun, and sbenv, and the management of the cache directories of
# the various build variants.

jobs:
  build:
    strategy:
      matrix:
        include:
          - { os: ubuntu-latest, python: '3.14' }
          - { os: macos-latest,  python: '3.14' }
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash -eux {0}

    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        path: src

    - name: Setup python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: ${{ matrix.python }}

    - name: Install package
      run: |
           mkdir -p "${GITHUB_WORKSPACE}/ci-logs"
           exec > >(tee -a "${GITHUB_WORKSPACE}/ci-logs/01_install_package.log") 2>&1
           python3 -mvenv myvenv
           . ./myvenv/bin/activate
           python3 -m pip install pybind11 cmake
           python3 -m pip install ./src
           sb --version

    - name: Test build variants
      run: |
           mkdir -p "${GITHUB_WORKSPACE}/ci-logs"
           exec > >(tee -a "${GITHUB_WORKSPACE}/ci-logs/02_test_build_variants.log") 2>&1
           . ./myvenv/bin/activate
           mkdir testdir
           cd testdir
           python3 ../src/devel/tests/test_build_variants.py

    - name: Upload logs
      if: always()
      uses: ./src/.github/actions/upload-logs
      with:
        name: ${{ matrix.os }}

  collect_logs:
    #Single job downloading all per-leg "ci-logs-*" artifacts above and
    #bundling them into one tarball, so the logs of all legs can be
    #downloaded with a single click:
    name: Collect all CI logs
    needs: [ build ]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Download all per-leg logs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: ci-logs-*
          path: all-ci-logs

      - name: Bundle into a single tarball
        env:
          #For pull requests, github.sha is a temporary merge commit, so use
          #the commit of the PR branch instead:
          CI_LOGS_FULL_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          echo "CI_LOGS_SHA=${CI_LOGS_FULL_SHA:0:10}" >> "$GITHUB_ENV"
          mkdir -p all-ci-logs
          tar -czf all-ci-logs-test-build-variants-${CI_LOGS_FULL_SHA:0:10}.tar.gz all-ci-logs

      - name: Upload combined log tarball
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: all-ci-logs-test-build-variants-${{ env.CI_LOGS_SHA }}
          path: all-ci-logs-test-build-variants-${{ env.CI_LOGS_SHA }}.tar.gz
          if-no-files-found: warn
