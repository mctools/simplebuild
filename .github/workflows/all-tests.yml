name: all-tests
on:
  push:
  pull_request:

# Workflow running the complete test suite (devel/tests/suite, see also
# devel/runtests.x) in various environments, as well as the direct (non-pytest)
# shell tests and the documentation build. The logs of all jobs are bundled
# into a single tarball by the final collect_logs job.

# Syntax:
#   https://docs.github.com/en/actions/using-workflows/workflow-syntax-for-github-actions
# Lint:
#   https://github.com/rhysd/actionlint

jobs:

  pip:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, CC: gcc,      CXX: g++,        python: '3.9'  }
          - { os: ubuntu-latest, CC: gcc,      CXX: g++,        python: '3.10' }
          - { os: ubuntu-latest, CC: clang,    CXX: clang++,    python: '3.11' }
          - { os: ubuntu-latest, CC: gcc-12,   CXX: g++-12,     python: '3.12' }
          - { os: ubuntu-latest, CC: gcc,      CXX: g++,        python: '3.13' }
          - { os: ubuntu-latest, CC: gcc,      CXX: g++,        python: '3.14' }
          - { os: macos-latest,  CC: clang,    CXX: clang++,    python: '3.12' }
    name: pip.${{ matrix.os }}.${{ matrix.CC }}.python-${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash -eux {0}
    env:
      CC: ${{ matrix.CC }}
      CXX: ${{ matrix.CXX }}
      SBTEST_EXPECT_DISABLED_EXTDEPS: NCrystal Numpy matplotlib Geant4 ZLib
      SBTEST_LOGDIR: ${{ github.workspace }}/ci-logs/sbtest_cmds

    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        path: src

    - name: Setup python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: ${{ matrix.python }}

    - name: Install
      run: |
           mkdir -p "${GITHUB_WORKSPACE}/ci-logs"
           exec > >(tee -a "${GITHUB_WORKSPACE}/ci-logs/01_install.log") 2>&1
           python3 -m pip install pybind11 cmake
           python3 -m pip install "./src[test]"
           if [ "${RUNNER_OS}" == "Linux" ]; then sudo apt-get install -y valgrind; fi
           python3 --version
           cmake --version
           sb --version

    - name: Run test suite
      env:
        SBTEST_REQUIRE: ${{ matrix.os == 'macos-latest' && 'shell:bash' || 'shell:bash valgrind' }}
      run: |
           mkdir -p "${GITHUB_WORKSPACE}/ci-logs"
           exec > >(tee -a "${GITHUB_WORKSPACE}/ci-logs/02_run_test_suite.log") 2>&1
           cd src
           python3 -m pytest -v -n auto --dist loadfile \
             --basetemp="${GITHUB_WORKSPACE}/pytest-tmp" \
             --junitxml="${GITHUB_WORKSPACE}/ci-logs/junit_02_test_suite.xml"

    - name: Test NCrystal linkage
      env:
        SBTEST_REQUIRE: ncrystal numpy
        SBTEST_EXPECT_DISABLED_EXTDEPS: ''
      run: |
           mkdir -p "${GITHUB_WORKSPACE}/ci-logs"
           exec > >(tee -a "${GITHUB_WORKSPACE}/ci-logs/03_test_ncrystal_linkage.log") 2>&1
           python3 -m pip install ncrystal
           cd src
           python3 -m pytest -v -k 'ncrystal_linkage or includecosts' \
             --basetemp="${GITHUB_WORKSPACE}/pytest-tmp-ncrystal" \
             --junitxml="${GITHUB_WORKSPACE}/ci-logs/junit_03_ncrystal_linkage.xml"

    - name: Upload logs
      if: always()
      uses: ./src/.github/actions/upload-logs
      with:
        name: pip.${{ matrix.os }}.${{ matrix.CC }}.python-${{ matrix.python }}

  conda:
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, macos-latest ]
    name: conda.${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash -el {0}
    env:
      CONDA_SOLVER: libmamba
      SBTEST_EXPECT_DISABLED_EXTDEPS: NCrystal Numpy matplotlib Geant4 ZLib
      SBTEST_LOGDIR: ${{ github.workspace }}/ci-logs/sbtest_cmds

    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Setup conda environment
      uses: conda-incubator/setup-miniconda@be893c923ea9cf1cf7cd510fbdde27c7e18cbdcb # v4.1.0
      with:
        miniforge-version: latest
        channels: conda-forge
        conda-remove-defaults: true
        activate-environment: sbenv
        environment-file: ./resources/conda_sbenv.yml

    - name: Install
      run: |
           mkdir -p "${GITHUB_WORKSPACE}/ci-logs"
           exec > >(tee -a "${GITHUB_WORKSPACE}/ci-logs/01_install.log") 2>&1
           #NB: the simple-build-system conda package was installed, but we
           #remove it (and *only* it, hence --force), and add ourselves via pip
           #(one side-effect of this is that we no longer have the simplebuild
           #conda activation script!):
           conda remove --yes --force simple-build-system
           conda install --yes pytest pytest-xdist ruff pyte
           python3 -m pip install .
           conda list
           sb --version

    - name: Run test suite
      env:
        SBTEST_REQUIRE: shell:bash
      run: |
           mkdir -p "${GITHUB_WORKSPACE}/ci-logs"
           exec > >(tee -a "${GITHUB_WORKSPACE}/ci-logs/02_run_test_suite.log") 2>&1
           python3 -m pytest -v -n auto --dist loadfile \
             --basetemp="${GITHUB_WORKSPACE}/pytest-tmp" \
             --junitxml="${GITHUB_WORKSPACE}/ci-logs/junit_02_test_suite.xml"

    - name: Test NCrystal linkage and cppcheck
      env:
        SBTEST_REQUIRE: ncrystal cppcheck numpy
        SBTEST_EXPECT_DISABLED_EXTDEPS: ''
      run: |
           mkdir -p "${GITHUB_WORKSPACE}/ci-logs"
           exec > >(tee -a "${GITHUB_WORKSPACE}/ci-logs/03_test_ncrystal_linkage_and_cppcheck.log") 2>&1
           conda install --yes ncrystal cppcheck
           python3 -m pytest -v -k 'ncrystal_linkage or cppcheck or includecosts' \
             --basetemp="${GITHUB_WORKSPACE}/pytest-tmp-ncrystal" \
             --junitxml="${GITHUB_WORKSPACE}/ci-logs/junit_03_ncrystal_linkage_and_cppcheck.xml"

    - name: Upload logs
      if: always()
      uses: ./.github/actions/upload-logs
      with:
        name: conda.${{ matrix.os }}

  shells:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, python: '3.14', shells: 'shell:bash shell:dash shell:zsh shell:ksh shell:ash' }
          #NB: ash is not available on macOS:
          - { os: macos-latest,  python: '3.14', shells: 'shell:bash shell:dash shell:zsh shell:ksh' }
    name: shells.${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash -eux {0}
    env:
      SBTEST_LOGDIR: ${{ github.workspace }}/ci-logs/sbtest_cmds

    steps:
    - name: Install more shells (Linux)
      if: runner.os == 'Linux'
      run: |
           mkdir -p "${GITHUB_WORKSPACE}/ci-logs"
           exec > >(tee -a "${GITHUB_WORKSPACE}/ci-logs/00_install_more_shells.log") 2>&1
           sudo apt install ksh ash zsh

    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        path: src

    - name: Setup python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: ${{ matrix.python }}

    - name: Install
      run: |
           mkdir -p "${GITHUB_WORKSPACE}/ci-logs"
           exec > >(tee -a "${GITHUB_WORKSPACE}/ci-logs/01_install.log") 2>&1
           #A venv is used like in the testshells workflow:
           python3 -mvenv myvenv
           . ./myvenv/bin/activate
           python3 -m pip install pybind11 cmake
           python3 -m pip install "./src[test]"
           sb --version

    - name: Run shell tests via pytest
      env:
        SBTEST_REQUIRE: ${{ matrix.shells }}
      run: |
           mkdir -p "${GITHUB_WORKSPACE}/ci-logs"
           exec > >(tee -a "${GITHUB_WORKSPACE}/ci-logs/02_run_shell_tests_via_pytest.log") 2>&1
           . ./myvenv/bin/activate
           cd src
           python3 -m pytest -v -m shells \
             --basetemp="${GITHUB_WORKSPACE}/pytest-tmp" \
             --junitxml="${GITHUB_WORKSPACE}/ci-logs/junit_02_shell_tests.xml"

    - name: Run shell tests directly
      run: |
           mkdir -p "${GITHUB_WORKSPACE}/ci-logs"
           exec > >(tee -a "${GITHUB_WORKSPACE}/ci-logs/03_run_shell_tests_directly.log") 2>&1
           . ./myvenv/bin/activate
           mkdir direct_shell_tests
           cd direct_shell_tests
           ../src/devel/tests/test_envsetup_manyshells.x
           mkdir sbswitch
           cd sbswitch
           ../../src/devel/tests/test_sbswitch.x

    - name: Upload logs
      if: always()
      uses: ./src/.github/actions/upload-logs
      with:
        name: shells.${{ matrix.os }}

  docs:
    name: docs
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -el {0}
    env:
      CONDA_SOLVER: libmamba

    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Setup conda environment
      uses: conda-incubator/setup-miniconda@be893c923ea9cf1cf7cd510fbdde27c7e18cbdcb # v4.1.0
      with:
        miniforge-version: latest
        channels: conda-forge
        conda-remove-defaults: true
        activate-environment: publish-doc-condaenv
        environment-file: .github/resources/publish-doc-condaenv.yml

    - name: Install
      run: |
           mkdir -p "${GITHUB_WORKSPACE}/ci-logs"
           exec > >(tee -a "${GITHUB_WORKSPACE}/ci-logs/01_install.log") 2>&1
           conda list
           python3 -mpip install .

    - name: Build documentation
      working-directory: ./doc/
      run: |
           mkdir -p "${GITHUB_WORKSPACE}/ci-logs"
           exec > >(tee -a "${GITHUB_WORKSPACE}/ci-logs/02_build_documentation.log") 2>&1
           make html SPHINXOPTS="-W"

    - name: Check HTML links
      working-directory: ./doc/
      run: |
           mkdir -p "${GITHUB_WORKSPACE}/ci-logs"
           exec > >(tee -a "${GITHUB_WORKSPACE}/ci-logs/03_check_html_links.log") 2>&1
           make linkcheck

    - name: Upload logs
      if: always()
      uses: ./.github/actions/upload-logs
      with:
        name: docs

  collect_logs:
    #Single job downloading all per-job "ci-logs-*" artifacts above and
    #bundling them into one tarball, so the logs of all jobs can be downloaded
    #with a single click:
    name: Collect all CI logs
    needs: [ pip, conda, shells, docs ]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Download all per-job logs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: ci-logs-*
          path: all-ci-logs

      - name: Bundle into a single tarball
        env:
          #For pull requests, github.sha is a temporary merge commit, so use
          #the commit of the PR branch instead:
          CI_LOGS_FULL_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          echo "CI_LOGS_SHA=${CI_LOGS_FULL_SHA:0:10}" >> "$GITHUB_ENV"
          mkdir -p all-ci-logs
          tar -czf all-ci-logs-all-tests-${CI_LOGS_FULL_SHA:0:10}.tar.gz all-ci-logs

      - name: Upload combined log tarball
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: all-ci-logs-all-tests-${{ env.CI_LOGS_SHA }}
          path: all-ci-logs-all-tests-${{ env.CI_LOGS_SHA }}.tar.gz
          if-no-files-found: warn
