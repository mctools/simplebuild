name: conda-test
on:
  push:
  pull_request:

jobs:
  build:
    strategy:
      matrix:
        os: [ ubuntu-latest, macos-latest ]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash -el {0}
    env:
      CONDA_SOLVER: libmamba

    steps:
    - name: Checkout main repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Setup conda environment
      uses: conda-incubator/setup-miniconda@be893c923ea9cf1cf7cd510fbdde27c7e18cbdcb # v4.1.0
      with:
        miniforge-version: latest
        channels: conda-forge
        conda-remove-defaults: true
        activate-environment: sbenv
        environment-file: ./resources/conda_sbenv.yml

    - name: Conda list
      run: |
        mkdir -p "${GITHUB_WORKSPACE}/ci-logs"
        exec > >(tee -a "${GITHUB_WORKSPACE}/ci-logs/01_conda_list.log") 2>&1
        conda list

    - name: Install self
      run: |
           mkdir -p "${GITHUB_WORKSPACE}/ci-logs"
           exec > >(tee -a "${GITHUB_WORKSPACE}/ci-logs/02_install_self.log") 2>&1
           #NB: the simple-build-system conda package was installed, but we
           #remove it (and *only* it, hence --force), and add ourselves via pip
           #(one side-effect of this is that we no longer have the simplebuild
           #conda activation script!):
           conda remove --yes --force simple-build-system
           python3 -mpip install .
           echo "sb --version:"
           sb --version

    - name: Build-and-test-release-mode
      run: |
           mkdir -p "${GITHUB_WORKSPACE}/ci-logs"
           exec > >(tee -a "${GITHUB_WORKSPACE}/ci-logs/03_build_and_test_release_mode.log") 2>&1
           mkdir myproj
           cd myproj
           sb --init core_val RELEASE COMPACT CACHEDIR::./somecustomcachedir
           sb -t --testexcerpts=100 --requirepkg CoreTests
           sbenv sb_core_extdeps --require-disabled NCrystal Numpy matplotlib Geant4 ZLib
           sb -t --testfilter='sb_coretests_testpycpp' --requirepkg CoreTests

    - name: Build-and-test-debug-mode
      run: |
           mkdir -p "${GITHUB_WORKSPACE}/ci-logs"
           exec > >(tee -a "${GITHUB_WORKSPACE}/ci-logs/04_build_and_test_debug_mode.log") 2>&1
           mkdir myproj_dbg
           cd myproj_dbg
           sb --init core_val DEBUG
           sb -t --testexcerpts=100 --requirepkg CoreTests
           sbenv sb_core_extdeps --require-disabled NCrystal Numpy matplotlib Geant4 ZLib

    - name: Verify-ncrystal-linkage
      run: |
           mkdir -p "${GITHUB_WORKSPACE}/ci-logs"
           exec > >(tee -a "${GITHUB_WORKSPACE}/ci-logs/05_verify_ncrystal_linkage.log") 2>&1
           #This will fail with tool old ncrystal wheels, but should always be
           #ok in conda:
           cd myproj
           conda install --yes ncrystal
           sb -t --testexcerpts=100 --requirepkg 'CoreTests,CoreLinkTests'

    - name: cppcheck
      run: |
           mkdir -p "${GITHUB_WORKSPACE}/ci-logs"
           exec > >(tee -a "${GITHUB_WORKSPACE}/ci-logs/06_cppcheck.log") 2>&1
           cd myproj
           conda install --yes cppcheck
           sb --exportcmds=cmds.json --requirepkg 'CoreTests,CoreLinkTests'
           test -f cmds.json
           mkdir ./cppcheck_cache
           cppcheck --inline-suppr --project=cmds.json --check-level=exhaustive -j4 --cppcheck-build-dir="$PWD"/cppcheck_cache --suppress='*:'"$CONDA_PREFIX"'/include/*' --error-exitcode=1

    - name: Upload logs
      if: always()
      uses: ./.github/actions/upload-logs
      with:
        name: ${{ matrix.os }}

  collect_logs:
    #Single job downloading all per-leg "ci-logs-*" artifacts above and
    #bundling them into one tarball, so the logs of all legs can be
    #downloaded with a single click:
    name: Collect all CI logs
    needs: [ build ]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Download all per-leg logs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: ci-logs-*
          path: all-ci-logs

      - name: Bundle into a single tarball
        env:
          #For pull requests, github.sha is a temporary merge commit, so use
          #the commit of the PR branch instead:
          CI_LOGS_FULL_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          echo "CI_LOGS_SHA=${CI_LOGS_FULL_SHA:0:10}" >> "$GITHUB_ENV"
          mkdir -p all-ci-logs
          tar -czf all-ci-logs-conda-test-${CI_LOGS_FULL_SHA:0:10}.tar.gz all-ci-logs

      - name: Upload combined log tarball
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: all-ci-logs-conda-test-${{ env.CI_LOGS_SHA }}
          path: all-ci-logs-conda-test-${{ env.CI_LOGS_SHA }}.tar.gz
          if-no-files-found: warn
